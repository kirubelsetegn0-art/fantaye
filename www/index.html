<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantaye – Everything • One Place</title>
<style>
:root{--bg:#07061a;--card:#14113699;--sel:#17143a;--line:#ffffff22;--tx:#f4f3ff;--mu:#a5a2d6;--g:linear-gradient(135deg,#22d3ee,#3b82f6 40%,#a855f7 75%,#ec4899);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1efff;--card:#ffffffcc;--sel:#fff;--line:#2a266033;--tx:#15123a;--mu:#5d5a8c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:system-ui,"Noto Sans Ethiopic","Segoe UI",sans-serif;padding-bottom:120px;background:radial-gradient(520px 380px at 0% -5%,#3b82f633,transparent),radial-gradient(480px 380px at 100% 8%,#a855f733,transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:720px;margin:auto}
header{position:sticky;top:8px;z-index:6;margin:10px 12px;padding:12px;border-radius:28px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 0 34px #3b82f633}
.r1,.r2,.r3{display:flex;gap:8px;align-items:center}.r1{justify-content:space-between}.r2,.r3{margin-top:10px}
.logo{display:flex;align-items:center;gap:8px;font-size:21px}.logo img{width:40px;height:40px;border-radius:13px;box-shadow:0 0 16px #a855f788}
.logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:12px 2px 0;font-size:24px;line-height:1.2;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
input,select,textarea{background:var(--sel);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:11px 14px;font:inherit;width:100%}
textarea{border-radius:18px}select{width:auto;max-width:48%}#q{flex:1}
.r3{font-size:14px;flex-wrap:wrap}.r3 select{padding:7px 10px}
#me{background:#22d3ee22;color:#22d3ee;border-radius:99px;padding:6px 12px;font-weight:700}
.chip{border:1px solid var(--line);background:#ffffff14;color:var(--tx);border-radius:99px;padding:7px 12px;cursor:pointer;font:inherit}
.btn{background:var(--g);color:#fff;border:0;border-radius:99px;padding:14px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:10px;box-shadow:0 0 20px #a855f755}
.btn.alt{background:var(--sel);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 14px}
.cat{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 15px;font:inherit;cursor:pointer;white-space:nowrap}
.cat.on{background:var(--g);border-color:transparent;color:#fff;box-shadow:0 0 18px #a855f788}
.grid{columns:2;column-gap:12px;padding:0 14px}
.item{break-inside:avoid;margin-bottom:12px;border-radius:24px;overflow:hidden;cursor:pointer;border:1.5px solid transparent;background:linear-gradient(var(--sel),var(--sel)) padding-box,var(--g) border-box}
.pic{height:130px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#3b82f633,#a855f733);position:relative}
.item:nth-child(3n+1) .pic{height:180px}
.badge{position:absolute;left:8px;bottom:8px;background:#07061acc;color:#22d3ee;padding:4px 10px;border-radius:99px;font-weight:800;font-size:13px}
.heart{position:absolute;top:8px;right:8px;background:#0006;color:#fff;border:0;border-radius:99px;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.th{position:relative;width:68px;height:68px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.th img{width:100%;height:100%;object-fit:cover}.th button{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:0;border-radius:99px;width:20px;height:20px;cursor:pointer;line-height:1}.add{width:68px;height:68px;border-radius:14px;border:1.5px dashed var(--mu);display:grid;place-items:center;font-size:26px;color:var(--mu);cursor:pointer}.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{flex:none;width:100%;max-height:260px;object-fit:cover;border-radius:16px;scroll-snap-align:center}
.msgs{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:50vh;overflow-y:auto}.bub{align-self:flex-end;background:var(--g);color:#fff;padding:9px 14px;border-radius:18px 18px 4px 18px;max-width:80%;word-break:break-word}.snd{display:flex;gap:8px}
.bub.o{align-self:flex-start;background:var(--sel);color:var(--tx);border:1px solid var(--line);border-radius:18px 18px 18px 4px}
.pcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;border:1px solid var(--line);margin:12px 0;background:var(--card)}.av{width:52px;height:52px;border-radius:18px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.info{padding:10px 12px;font-size:14px}.pr{color:#22d3ee;font-weight:800;font-size:16px}.mu{color:var(--mu);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:50px 20px}.empty b{display:block;font-size:56px}
.form{padding:14px}.form label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
.sheet{padding:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(94%,460px);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:32px;padding:8px 6px;z-index:7;box-shadow:0 8px 40px #0008,0 0 30px #a855f733}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}nav button span{display:block;font-size:20px}nav button.on{color:#22d3ee;font-weight:700}
nav button[data-v=sell] span{width:54px;height:54px;margin:-32px auto 2px;border-radius:20px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 0 26px #a855f7bb}
dialog{background:var(--sel);color:var(--tx);border:1px solid var(--line);border-radius:26px;max-width:420px;width:92%}dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:var(--g);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;display:none;z-index:9;max-width:90%;text-align:center}
</style>
</head>

  if(auth&&sess&&sess.exp<Date.now()/1000+60)await refresh();
  const h={apikey:KEY,...headers};
  if(auth&&sess)h.Authorization="Bearer "+sess.at;
  if(body&&!raw){h["Content-Type"]="application/json";body=JSON.stringify(body)}
  const r=await fetch(SB+path,{method,headers:h,body});
  const tx=await r.text();
  if(!r.ok)throw new Error(r.status+" "+tx.slice(0,140));
  return tx?JSON.parse(tx):null}
function setSess(d){sess={at:d.access_token,rt:d.refresh_token,exp:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),uid:d.user.id};sv("fy3_sess",sess)}
async function refresh(){try{setSess(await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:sess.rt},auth:false}))}catch(e){sess=null;sv("fy3_sess",null);await signIn()}}
async function signIn(){
  setSess(await api("/auth/v1/signup",{method:"POST",body:{data:{}},auth:false}));
  user={name:"Guest "+Math.random().toString(36).slice(2,6).toUpperCase(),phone:"",auto:1};sv("fy3_user",user);
  try{await api("/rest/v1/profiles",{method:"POST",body:{id:sess.uid,name:user.name},headers:{Prefer:"resolution=merge-duplicates,return=minimal"}})}catch(e){}}
const fromDb=r=>({id:r.id,uid:r.user_id,t:r.title,desc:r.description,p:r.price||"—",c:r.category||0,city:r.city||"",co:r.country,lat:r.lat,lng:r.lng,seller:r.seller_name,ph:r.phone,imgs:r.images||[]});
const wd=x=>({...x,dist:me&&x.lat!=null?Math.round(km(me,x)):null});
async function load(){
  loading=1;err="";render();
  try{let q="/rest/v1/listings?select=*&order=created_at.desc&limit=200";
    if(country)q+="&country=eq."+country;
    else if(me&&rad){const d=rad/111,dl=rad/(111*Math.max(.2,Math.cos(me.lat*Math.PI/180)));q+=`&lat=gte.${me.lat-d}&lat=lte.${me.lat+d}&lng=gte.${me.lng-dl}&lng=lte.${me.lng+dl}`}
    items=(await api(q,{auth:false})).map(fromDb);items.forEach(x=>cache[x.id]=x)}catch(e){err=e.message}
  loading=0;render()}
async function fetchMissing(ids){const m=[...new Set(ids)].filter(i=>!cache[i]);if(!m.length)return;(await api("/rest/v1/listings?select=*&id=in.("+m.join(",")+")",{auth:false})).map(fromDb).forEach(x=>cache[x.id]=x)}
async function loadSaved(){try{await fetchMissing(saved)}catch(e){err=e.message}if(v==="saved")render()}
const mine=m=>m.sender===(sess&&sess.uid);
const thread=()=>msgs.filter(m=>m.listing_id===chat.lid&&(m.sender===chat.o||m.receiver===chat.o));
const bubbles=()=>thread().map(m=>`<div class="bub ${mine(m)?"":"o"}">${esc(m.body)}</div>`).join("");
async function loadMsgs(){
  if(!sess)return;
  try{msgs=await api(`/rest/v1/messages?select=*&or=(sender.eq.${sess.uid},receiver.eq.${sess.uid})&order=id.asc&limit=500`);await fetchMissing(msgs.map(m=>m.listing_id))}catch(e){err=e.message;return}
  if(v!=="msgs")return;
  if(chat){const e=document.querySelector(".msgs");if(e){e.innerHTML=bubbles();e.scrollTop=e.scrollHeight}}else render()}
async function loadStat(uid){
  if(pstat[uid]!==undefined)return;pstat[uid]=null;
  try{const[L,P]=await Promise.all([api("/rest/v1/listings?select=id,created_at&user_id=eq."+uid,{auth:false}),api("/rest/v1/profiles?select=name&id=eq."+uid,{auth:false})]);
    pstat[uid]={n:L.length,since:L.length?L.map(a=>a.created_at).sort()[0]:null,name:P[0]&&P[0].name}}catch(e){}
  if(chat&&chat.o===uid&&$("pc"))$("pc").innerHTML=pcard()}
function pcard(){
  const o=chat.o,x=cache[chat.lid]||{},s=pstat[o]||{},isS=o===x.uid,nm=s.name||(isS?x.seller:"")||"?",fl=(CO.find(c=>c[0]===x.co)||[0,0,""])[2],d=s.since?new Date(s.since).toLocaleDateString():"";
  return `<div class="av">${esc(nm[0].toUpperCase())}</div><div><b>${esc(nm)}</b>${isS?`<div class="mu">📍 ${esc(x.city)} ${fl}</div>`:""}<div class="mu">📦 ${s.n??"…"} ${t.ads}${d?" · "+t.since+" "+d:""}</div>${isS&&x.ph?`<div class="pr">📞 ${esc(x.ph)}</div>`:""}</div>`}
function msgsView(){
  if(chat){const x=cache[chat.lid];
    return `<div class="form"><button class="chip" data-back="1" style="color:var(--tx)">← ${t.back}</button><div class="pcard" id="pc">${pcard()}</div><h3>${x?ICO[x.c]+" "+esc(x.t):""}</h3><div class="msgs">${bubbles()}</div><div class="snd"><input id="cI" placeholder="${t.typeMsg}"><button class="btn" id="cS" style="width:auto;margin:0;padding:12px 18px">${t.send}</button></div></div>`}
  const g={};msgs.forEach(m=>{const o=mine(m)?m.receiver:m.sender;g[m.listing_id+"|"+o]={lid:m.listing_id,o,last:m}});
  const L=Object.entries(g).sort((a,b)=>b[1].last.id-a[1].last.id);
  return L.length?`<div class="form">${L.map(([k,c])=>{const x=cache[c.lid];return `<div class="item" data-conv="${k}" style="margin-bottom:10px;padding:12px"><b>${x?ICO[x.c]+" "+esc(x.t):"…"}</b><div class="mu">${esc(c.last.body)}</div></div>`}).join("")}</div>`:`<div class="empty"><b>💬</b>${err?"⚠ "+esc(err):t.msgE}</div>`}
async function sendMsg(){
  const i=$("cI"),s=i&&i.value.trim();if(!s||!chat)return;i.value="";
  try{if(!sess)await signIn();await api("/rest/v1/messages",{method:"POST",body:{listing_id:chat.lid,receiver:chat.o,body:s},headers:{Prefer:"return=minimal"}});await loadMsgs()}catch(e){toast("⚠ "+e.message)}}
function openChat(id){
  $("dlg").close();const x=cache[id];if(!x||!x.uid)return;
  v="msgs";chat=sess&&x.uid===sess.uid?null:{lid:id,o:x.uid};render();loadMsgs()}
function card(x){return `<article class="item" data-id="${x.id}"><div class="pic">${x.imgs&&x.imgs[0]?`<img src="${esc(x.imgs[0])}" alt="">`:ICO[x.c]}<button class="heart" data-h="${x.id}">${saved.includes(x.id)?'<span style="color:#ec4899">♥</span>':"♡"}</button><span class="badge">${esc(x.p)}</span></div><div class="info"><b>${esc(x.t)}</b><div class="mu">📍 ${esc(x.city)}${x.dist!=null?" · "+x.dist+" km":""} · ${t["c"+x.c]}</div></div></article>`}
const empty=(i,s)=>`<div class="empty"><b>${i}</b>${s}</div>`;
function filtered(){const q=$("q").value.toLowerCase();
  return items.map(wd).filter(x=>(cat<0||x.c===cat)&&(x.t+x.city).toLowerCase().includes(q)&&(!rad||!me||x.dist==null||x.dist<=rad)).sort((a,b)=>(a.dist??1e9)-(b.dist??1e9))}
function render(){
  t=Object.fromEntries(K.map((k,i)=>[k,(D[lang]||D.en).split("|")[i]]));Object.assign(t,Object.fromEntries(MK.map((k,i)=>[k,(M[lang]||M.en)[i]])));t.ads=(N[lang]||N.en)[0];t.since=(N[lang]||N.en)[1];{const q=P[lang]||P.en;t.reg=q[0];t.login=q[1];t.pw=q[2]}
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("lang").value=lang;$("what").textContent=t.what;$("q").placeholder=t.look;$("gps").textContent="📍 "+t.detect;
  $("country").innerHTML=`<option value="">🌍 ${t.world}</option>`+CO.map(c=>`<option value="${c[0]}" ${c[0]===country?"selected":""}>${c[2]} ${c[1]}</option>`).join("");
  $("rad").innerHTML=[10,25,50,100,0].map(x=>`<option value="${x}" ${x===rad?"selected":""}>${x?x+" km":t.any}</option>`).join("");
  $("me").textContent=me?"📍 "+(me.label||t.near):(denied?"🚫 GPS":"📍 …");
  $("flt").hidden=v!=="home";
  $("nav").innerHTML=["home|🏠","saved|🔖","sell|✦","msgs|💬","profile|👤"].map(s=>{const[k,i]=s.split("|");return `<button data-v="${k}" class="${v===k?"on":""}"><span>${i}</span>${t[k]}</button>`}).join("");
  let h="";
  if(v==="home"){const L=filtered();
    h=`<div class="cats">${[-1,...ICO.keys()].map(i=>`<button class="cat ${cat===i?"on":""}" data-c="${i}">${i<0?"✦":ICO[i]} ${i<0?t.all:t["c"+i]}</button>`).join("")}</div>`+(loading?empty("⏳","…"):L.length?`<div class="grid">${L.map(card).join("")}</div>`:empty("📍",err?"⚠ "+esc(err):t.none))}
  else if(v==="saved"){const L=saved.map(i=>cache[i]).filter(Boolean).map(wd);h=L.length?`<div class="grid" style="padding-top:14px">${L.map(card).join("")}</div>`:empty("🗂️",t.savedE)}
  else if(v==="msgs")h=msgsView();
  else if(v==="sell")h=`<div class="form"><label id="phL"></label><div class="thumbs" id="th"></div><input id="fI" type="file" accept="image/*" multiple hidden><label>${t.title}*</label><input id="fT"><label>${t.cat}*</label><select id="fC" style="max-width:100%;width:100%">${ICO.map((_,i)=>`<option value="${i}">${t["c"+i]}</option>`).join("")}</select><label>${t.desc}*</label><textarea id="fD" rows="3"></textarea><label>${t.price}</label><input id="fP" placeholder="ETB / USD / EUR…"><label>${t.loc}*</label><input id="fL" value="${esc(me&&me.label||"")}"><label>${t.name}*</label><input id="fN" value="${esc(user&&user.name||"")}"><label>${t.phone}*</label><input id="fH" inputmode="tel" value="${esc(user&&user.phone||"")}"><button class="btn" id="post">${t.post}</button></div>`;
  else h=user&&!user.auto?`<div class="sheet"><h3>👤 ${esc(user.name)}</h3><p class="mu">${esc(user.phone)}</p><p class="mu">📦 ${items.filter(i=>sess&&i.uid===sess.uid).length} ${t.ads}</p><button class="btn alt" id="out">✕</button></div>`:`<div class="sheet">${user?`<p class="mu">👤 ${esc(user.name)}</p>`:""}<label class="mu">${t.name}</label><input id="uN"><label class="mu">${t.phone}</label><input id="uH" inputmode="tel" placeholder="09…"><label class="mu">${t.pw}</label><input id="uP" type="password"><button class="btn" id="reg">${t.reg}</button><button class="btn alt" id="login">${t.login}</button></div>`;
  $("app").innerHTML=h;
  if(v==="sell")drawTh();
  if(v==="msgs"&&chat)loadStat(chat.o)}
function setMe(m){const[c,d]=near(m);me={lat:m.lat,lng:m.lng,label:m.label||null};denied=0;if(m.auto&&d<800)country=c[0];load()}
function gps(){if(!navigator.geolocation){denied=1;return render()}navigator.geolocation.getCurrentPosition(p=>setMe({lat:p.coords.latitude,lng:p.coords.longitude,auto:true}),()=>{denied=1;if(!me)toast(t.world+" 🌍");render()},{timeout:8000,maximumAge:600000})}
async function register(){
  const n=$("uN").value.trim(),p=normPhone($("uH").value),pw=$("uP").value;
  if(!n||p.length<8||pw.length<6)return toast("* "+t.name+", "+t.phone+", "+t.pw);
  try{if(!sess)await signIn();
    await api("/auth/v1/user",{method:"PUT",body:{email:p+"@fantaye.app",password:pw,data:{name:n,phone:p}}});
    user={name:n,phone:p};sv("fy3_user",user);
    await api("/rest/v1/profiles?id=eq."+sess.uid,{method:"PATCH",body:{name:n,phone:p},headers:{Prefer:"return=minimal"}});
    toast(t.ok)}catch(e){toast("⚠ "+e.message)}
  render()}
async function login(){
  const p=normPhone($("uH").value),pw=$("uP").value;
  if(p.length<8||pw.length<6)return toast("* "+t.phone+", "+t.pw);
  try{const d=await api("/auth/v1/token?grant_type=password",{method:"POST",body:{email:p+"@fantaye.app",password:pw},auth:false});
    setSess(d);const m=d.user.user_metadata||{};user={name:m.name||p,phone:p};sv("fy3_user",user);toast(t.ok);await load()}catch(e){toast("⚠ "+e.message)}
  render()}
async function post(){
  const T=$("fT").value.trim(),D2=$("fD").value.trim(),L=$("fL").value.trim(),N2=$("fN").value.trim(),H=$("fH").value.trim();
  if(!T||!D2||!L||!N2||!H)return toast("* "+t.title+", "+t.desc+", "+t.loc+", "+t.name+", "+t.phone);
  if(!me){gps();return toast("📍 "+t.detect)}
  const P=$("fP").value.trim(),C=+$("fC").value;toast("⏳ …");
  try{if(!sess)await signIn();
    const urls=[];for(let i=0;i<pend.length;i++){const b=await(await fetch(pend[i])).blob(),p=`${sess.uid}/${Date.now()}-${i}.jpg`;await api("/storage/v1/object/ads/"+p,{method:"POST",body:b,raw:true,headers:{"Content-Type":"image/jpeg","x-upsert":"true"}});urls.push(SB+"/storage/v1/object/public/ads/"+p)}
    await api("/rest/v1/listings",{method:"POST",body:{title:T,description:D2,price:P,category:C,city:L,country:near(me)[0][0],lat:me.lat,lng:me.lng,seller_name:N2,phone:H,images:urls},headers:{Prefer:"return=minimal"}});
    if(user&&user.auto){user={name:N2,phone:H};sv("fy3_user",user)}
    api("/rest/v1/profiles?id=eq."+sess.uid,{method:"PATCH",body:{name:N2,phone:H},headers:{Prefer:"return=minimal"}}).catch(()=>{});
    pend=[];toast(t.ok);v="home";await load()}catch(e){toast("⚠ "+e.message)}}
$("lang").onchange=e=>{lang=e.target.value;sv("fy3_lang",lang);render()};
$("q").oninput=render;
$("rad").onchange=e=>{rad=+e.target.value;load()};
$("country").onchange=e=>{country=e.target.value;const c=CO.find(c=>c[0]===country);if(c)setMe({lat:c[4],lng:c[5],label:c[3]});else load()};
$("gps").onclick=gps;
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let b;
  if(b=g("[data-v]")){v=b.dataset.v;chat=null;render();scrollTo(0,0);if(v==="msgs")loadMsgs();if(v==="saved")loadSaved()}
  else if(b=g("[data-c]")){cat=+b.dataset.c;render()}
  else if(b=g("[data-h]")){const id=+b.dataset.h;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];sv("fy2_saved",saved);render()}
  else if(b=g("[data-id]")){const x=cache[+b.dataset.id];if(!x)return;
    $("dlg").innerHTML=`${x.imgs&&x.imgs.length?`<div class="gal">${x.imgs.map(s=>`<img src="${esc(s)}" alt="">`).join("")}</div>`:`<div class="pic" style="border-radius:12px">${ICO[x.c]}</div>`}<h3>${esc(x.t)}</h3><div class="pr">${esc(x.p)}</div><p>${esc(x.desc||"")}</p><div class="mu">📍 ${esc(x.city)}${x.seller?" · "+esc(x.seller):""}</div>${x.ph?`<p class="pr">📞 ${esc(x.ph)}</p>`:""}<button class="btn" data-chat="${x.id}">💬 ${t.msgBtn}</button><button class="btn alt" onclick="dlg.close()">✕</button>`;$("dlg").showModal()}
  else if(b=g("[data-oauth]"))oauth(b.dataset.oauth)
  else if(g("#reg"))register()
  else if(g("#login"))login()
  else if(b=g("[data-chat]"))openChat(+b.dataset.chat)
  else if(b=g("[data-conv]")){const[a,o]=b.dataset.conv.split("|");chat={lid:+a,o};render();loadMsgs()}
  else if(g("[data-back]")){chat=null;render()}
  else if(g("#cS"))sendMsg()
  else if(g("#addI"))$("fI").click()
  else if(b=g("[data-rm]")){pend.splice(+b.dataset.rm,1);drawTh()}
  else if(g("#out")){user=null;sess=null;sv("fy3_user",null);sv("fy3_sess",null);signIn().then(render)}
  else if(g("#post"))post()
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cI")sendMsg()});
function drawTh(){$("phL").textContent="📷 "+pend.length+"/3";$("th").innerHTML=pend.map((s,i)=>`<div class="th"><img src="${s}" alt=""><button data-rm="${i}">✕</button></div>`).join("")+(pend.length<3?`<div class="add" id="addI">＋</div>`:"")}
const shrink=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});
document.addEventListener("change",async e=>{if(e.target.id!=="fI")return;for(const f of [...e.target.files].slice(0,3-pend.length)){const d=await shrink(f);if(d)pend.push(d)}e.target.value="";drawTh()});
const P={en:["Create account","Log in","Password (min 6)"],am:["መለያ ክፈት","ግባ","የይለፍ ቃል (ቢያንስ 6)"],ar:["إنشاء حساب","تسجيل الدخول","كلمة المرور (6 على الأقل)"],es:["Crear cuenta","Entrar","Contraseña (mín. 6)"],fr:["Créer un compte","Se connecter","Mot de passe (min. 6)"],zh:["注册","登录","密码（至少6位）"]};
const normPhone=p=>{let d=String(p).replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(/^0[79]\d{8}$/.test(d))d="251"+d.slice(1);if(/^[79]\d{8}$/.test(d))d="251"+d;return d};
const b64=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
const BACK=()=>encodeURIComponent(location.origin+location.pathname);
async function oauth(p){
  if(p!=="Google")return toast(p+": soon");
  if(!/github\.io$/.test(location.hostname))return toast("Google: kirubelsetegn0-art.github.io/fantaye");
  try{
    if(sess){const r=await api("/auth/v1/user/identities/authorize?provider=google&skip_http_redirect=true&redirect_to="+BACK());if(r&&r.url){location.href=r.url;return}}
    location.href=SB+"/auth/v1/authorize?provider=google&redirect_to="+BACK()
  }catch(e){toast("⚠ "+e.message)}}
async function oauthReturn(){
  const h=new URLSearchParams(location.hash.slice(1)+"&"+location.search.slice(1));
  if(!h.get("access_token")&&!h.get("error_code")&&!h.get("error"))return 0;
  history.replaceState(null,"",location.pathname);
  if(h.get("error_code")==="identity_already_exists"){sess=null;sv("fy3_sess",null);location.href=SB+"/auth/v1/authorize?provider=google&redirect_to="+BACK();return 1}
  if(!h.get("access_token")){toast("⚠ "+(h.get("error_description")||h.get("error")));return 0}
  const at=h.get("access_token"),pl=b64(at.split(".")[1]);
  sess={at,rt:h.get("refresh_token"),exp:+h.get("expires_at")||pl.exp,uid:pl.sub};sv("fy3_sess",sess);
  try{const u=await api("/auth/v1/user"),m=u.user_metadata||{};
    user={name:m.full_name||m.name||u.email||"Google",phone:(user&&user.phone)||"",google:1};sv("fy3_user",user);
    await api("/rest/v1/profiles?id=eq."+sess.uid,{method:"PATCH",body:{name:user.name},headers:{Prefer:"return=minimal"}})}catch(e){toast("⚠ "+e.message)}
  v="profile";return 0}
setInterval(()=>{if(v==="msgs")loadMsgs()},4000);
render();
(async()=>{let redirected=0;try{redirected=await oauthReturn()}catch(e){}if(redirected)return;try{if(!sess)await signIn()}catch(e){err=e.message}render();gps();load();loadMsgs()})();
</script>
